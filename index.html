<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cs team</title>
    <h1> 
        <strong>Онлайн курси ІТ 'CS team'</strong>
    </h1>
</head>
<body>
    <form>
        <p><input type="text" required placeholder="Введіть ваше ім'я та прівище"></p>
        <p><input type="password" required placeholder="Введіть ваш пароль" minlength="8"></p>
        <p><input type="email" placeholder="Введіть вашу електрону пошту"></p>
        <p><input type="number"  placeholder="Введіть ваш номер телефону"></p>
        <p><input type="date" min="1956-09-04" max="2012-09-04"  placeholder="Введіть ваш день народження"></p>
    <h3>Виберіть рівень підготовки</h3>
        <p><input type="radio" name="course" checked>Початковий</p>
        <p><input type="radio" name="course">Середній</p>
        <p><input type="radio" name="course">Високий</p>
        <h3>Виберіть тему(теми), яка вас цікавить:</h3>
        <p><input type="checkbox" name="tema">HTML</p>
        <p><input type="checkbox" name="tema">CSS</p>
        <p><input type="checkbox" name="tema">JavaScript</p>
        <p><input type="checkbox" name="tema">Angular</p>
<h3>Виберіть форму навчання</h3>
<p><select name="city">
        <option value="online">Онлайн</option>
        <option value="offline">Очно</option>
        <option value="online+offline">Змішаний формат</option>
    </select></p>
<label>Чому ви хочете пройти цей курс?</label>
        <p><textarea maxlength="300"></textarea></p>
    </form>
</html>
